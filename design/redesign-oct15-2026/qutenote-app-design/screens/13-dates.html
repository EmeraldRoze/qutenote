<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuteNote dates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&amp;family=Anonymous+Pro:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A32D6}a:hover{color:#231A3A}
.qn-row::-webkit-scrollbar{display:none}
</style>
<style>html{background:#E9E4F2}body{display:flex;justify-content:center;padding:24px 0}body>div{border-radius:44px;box-shadow:0 20px 60px rgba(35,26,58,.18)}</style>
</head>
<body>
<div style="width: 390px; height: 1000px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8F2; background-image: linear-gradient(to bottom, #FBF8F2 0, #FBF8F2 142px, #D9CFEC 142px, #D9CFEC 144px, transparent 144px), repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); font-family: 'Anonymous Pro', ui-monospace, Menlo, monospace; color: #231A3A; padding: 0 0 124px">
  <header data-qn-band="144" style="height: 144px; box-sizing: border-box; padding-top: 54px; flex: none; display: flex; flex-direction: column; justify-content: center">
  <div style="padding: 0 20px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 28px; letter-spacing: -0.02em">Important dates</h1>
    <a href="14-add-a-date.html" aria-label="Add a date" style="text-decoration: none; box-sizing: border-box; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #5A32D6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
  </div>
  </header>

  <div style="margin: 20px 20px 0; background: #FFFFFF; border: 1.5px solid #E3DCF2; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
    <span aria-hidden="true" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #C6FF3D; border: 1.5px solid #231A3A; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#231A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>
    </span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 700">Reminders</span>
      <span style="font-size: 14px; color: #4A4163">We'll buzz you 7 days before.</span>
    </span>
    <button role="switch" aria-checked="false" aria-label="Reminders" style="width: 52px; height: 32px; flex: none; border-radius: 16px; border: 1.5px solid #231A3A; background: #E3DCF2; position: relative; padding: 0; cursor: pointer">
      <span style="position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #231A3A; box-sizing: border-box"></span>
    </button>
  </div>

  <div style="margin: 18px 20px 0; border-radius: 26px; border: 2px dashed #FF6EB4; background: #FFE6F2; padding: 26px 20px 22px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <img src="../assets/emoji/cake_emoji.png" alt="" style="width: 110px; height: auto; transform: rotate(-4deg)">
    <h2 style="margin: 14px 0 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 22px; line-height: 1.2">Never miss a birthday again.</h2>
    <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: #4A4163; max-width: 280px">Add the days that matter and we'll nudge you in time to mail something real.</p>
    <a href="14-add-a-date.html" style="text-decoration: none; box-sizing: border-box; margin-top: 18px; width: 100%; display: flex; align-items: center; justify-content: center; height: 56px; border: 0; border-radius: 28px; background: #5A32D6; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; cursor: pointer">+ ADD A DATE</a>
  </div>

  <h2 style="margin: 26px 20px 10px; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 18px">Quick add</h2>
  <div class="qn-row" style="padding: 0 20px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none">
    <a href="14-add-a-date.html" style="text-decoration: none; box-sizing: border-box; flex: none; display: flex; align-items: center; min-height: 44px; color: #231A3A; padding: 0 16px; border-radius: 22px; border: 1.5px solid #231A3A; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #231A3A; cursor: pointer">+ Birthday</a>
    <a href="14-add-a-date.html" style="text-decoration: none; box-sizing: border-box; flex: none; display: flex; align-items: center; min-height: 44px; color: #231A3A; padding: 0 16px; border-radius: 22px; border: 1.5px solid #231A3A; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #231A3A; cursor: pointer">+ Anniversary</a>
    <a href="14-add-a-date.html" style="text-decoration: none; box-sizing: border-box; flex: none; display: flex; align-items: center; min-height: 44px; color: #231A3A; padding: 0 16px; border-radius: 22px; border: 1.5px solid #231A3A; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #231A3A; cursor: pointer">+ Pet gotcha day</a>
    <a href="14-add-a-date.html" style="text-decoration: none; box-sizing: border-box; flex: none; display: flex; align-items: center; min-height: 44px; color: #231A3A; padding: 0 16px; border-radius: 22px; border: 1.5px solid #231A3A; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #231A3A; cursor: pointer">+ Hard day</a>
    <span aria-hidden="true" style="flex: none; width: 12px"></span>
  </div>

  <button style="margin: 20px 20px 0; width: calc(100% - 40px); min-height: 72px; border-radius: 18px; border: 1.5px solid #E3DCF2; background: #FFFFFF; display: flex; align-items: center; gap: 14px; padding: 10px 16px; font-family: inherit; text-align: left; color: #231A3A; cursor: pointer">
    <img src="../assets/emoji/bff_emoji.png" alt="" style="height: 48px; width: auto; flex: none">
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 700">Pull birthdays from contacts</span>
      <span style="font-size: 13px; color: #4A4163">Fill this page in one tap</span>
    </span>
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A4163" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
  </button>

  <nav aria-label="Tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 104px; box-sizing: border-box; background-color: #FBF8F2; background-image: repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); background-position: 0 -32px; border-top: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 14px">
    <a href="10-home.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #7A7389; font-size: 14px; font-weight: 700"><img src="../assets/emoji/house_emoji.png" alt="" style="height: 38px; width: auto; filter: grayscale(1); opacity: 0.55">Home</a>
    <a href="12-qts.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #7A7389; font-size: 14px; font-weight: 700"><img src="../assets/emoji/bff_emoji.png" alt="" style="height: 38px; width: auto; filter: grayscale(1); opacity: 0.55">QTs</a>
    <a href="11-send-pick-a-card.html" aria-label="Send a card" style="display: flex; justify-content: center; margin-top: -36px; text-decoration: none"><span style="width: 84px; height: 94px; box-sizing: border-box; padding: 6px; border-radius: 12px; background: #EEE8FB; border: 4px dashed #5A32D6; transform: rotate(-7deg); box-shadow: 0 10px 24px rgba(90, 50, 214, 0.28); display: flex"><span style="flex: 1; border-radius: 7px; background: #5A32D6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; padding-left: 0.2em"><svg aria-hidden="true" width="44" height="30" viewBox="0 0 44 30"><path d="M14 27C6 21 2 16 2 10.5 2 6 5.5 3 9.5 3c2.4 0 4 1.2 4.5 2.6C14.5 4.2 16.1 3 18.5 3 22.5 3 26 6 26 10.5 26 16 22 21 14 27z" fill="#C6FF3D"></path><path d="M23 9c3-2 5-2 8 0s5 2 8 0M23 15c3-2 5-2 8 0s5 2 8 0M23 21c3-2 5-2 8 0s5 2 8 0" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"></path></svg>SEND</span></span></a>
    <a href="13-dates.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #5A32D6; font-size: 14px; font-weight: 700"><img src="../assets/emoji/calendar_emoji.png" alt="" style="height: 38px; width: auto">Dates</a>
    <a href="15-profile.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #7A7389; font-size: 14px; font-weight: 700"><img src="../assets/emoji/sunglasses_emoji.png" alt="" style="height: 38px; width: auto; filter: grayscale(1); opacity: 0.55">Profile</a>
  </nav>
</div>
</body>
</html>
