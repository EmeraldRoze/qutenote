<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuteNote profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&amp;family=Anonymous+Pro:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A32D6}a:hover{color:#231A3A}
</style>
<style>html{background:#E9E4F2}body{display:flex;justify-content:center;padding:24px 0}body>div{border-radius:44px;box-shadow:0 20px 60px rgba(35,26,58,.18)}</style>
</head>
<body>
<div style="width: 390px; height: 1436px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8F2; background-image: linear-gradient(to bottom, #FBF8F2 0, #FBF8F2 358px, #D9CFEC 358px, #D9CFEC 360px, transparent 360px), repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); font-family: 'Anonymous Pro', ui-monospace, Menlo, monospace; color: #231A3A; padding-bottom: 124px">

  <header style="height: 360px; box-sizing: border-box; padding: 54px 20px 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; position: relative">
    <div style="display: flex; justify-content: flex-end">
    <div style="display: flex; gap: 10px">
      <button aria-label="Notifications, 2 new" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #231A3A; box-sizing: border-box; border: 1.5px solid #E3DCF2; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>
        <span style="position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px; border-radius: 10px; background: #C6FF3D; color: #231A3A; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 1.5px solid #231A3A">2</span>
      </button>
      <a href="16-settings.html" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #231A3A; box-sizing: border-box; border: 1.5px solid #E3DCF2; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </a>
    </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="position: relative; width: 290px; height: 174px; transform: translateX(71px) rotate(-4deg)">
        <img src="../assets/brand/postmark_heart_stamp.png" alt="" style="width: 290px; height: auto; display: block">
        <span style="position: absolute; left: 34px; top: 68px; width: 80px; height: 44px; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', system-ui, sans-serif; font-size: 22px; font-weight: 600; color: #231A3A">ER</span>
        <div style="position: absolute; left: 16px; top: 25px"><button aria-label="Pick your status emoji" style="position: absolute; top: -10px; left: -10px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #FBF8F2; background: #5A32D6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button></div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span aria-hidden="true" style="width: 40px; flex: none"></span>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span style="font-family: 'Unbounded', system-ui, sans-serif; font-size: 22px; letter-spacing: -0.01em">Emerald R.</span>
          <span style="font-size: 15px; color: #4A4163">@emeraldroze</span>
        </div>
        <button aria-label="Show my QR code" style="width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1.5px solid #231A3A; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #231A3A; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="6" height="6" rx="1"></rect><rect x="14.5" y="3.5" width="6" height="6" rx="1"></rect><rect x="3.5" y="14.5" width="6" height="6" rx="1"></rect><path d="M14.5 14.5h2v2h-2zM18.5 18.5h2v2h-2z"></path></svg></button>
      </div>
    </div>
  </header>
  <div style="display: flex; flex-direction: column; align-items: center">
    <label for="status-edit" style="align-self: stretch; margin: 14px 20px 0; background: #FFFFFF; border: 1.5px solid #E3DCF2; border-radius: 18px; padding: 10px 12px 10px 10px; display: flex; align-items: center; gap: 10px; cursor: text">
      <img src="../assets/emoji/thought_bubble_emoji.png" alt="" style="width: 26px; height: auto; flex: none">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="display: flex; justify-content: space-between; font-size: 13px; color: #4A4163"><span>Your status</span><span>30/60</span></span>
        <input id="status-edit" value="Finally unpacked the last box." maxlength="60" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 16px; font-weight: 700; color: #231A3A; width: 100%">
      </span>
      <span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #F3EEFF; display: flex; align-items: center; justify-content: center; color: #5A32D6"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"></path><path d="M14 7l3 3"></path></svg></span>
    </label>
  </div>

  <div style="margin: 20px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button style="min-height: 76px; border-radius: 16px; border: 1.5px solid #E3DCF2; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 700; color: #231A3A; cursor: pointer"><img src="../assets/emoji/bff_emoji.png" alt="" style="width: 30px; height: auto">Add friends</button>
    <button style="min-height: 76px; border-radius: 16px; border: 1.5px solid #E3DCF2; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 700; color: #231A3A; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A32D6" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>Invite, get a card</button>
    <button style="min-height: 76px; border-radius: 16px; border: 1.5px solid #E3DCF2; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 700; color: #231A3A; cursor: pointer"><img src="../assets/emoji/pen_emoji.png" alt="" style="width: 32px; height: auto">Handwriting</button>
  </div>

  <div role="tablist" aria-label="Your cards" style="margin: 20px 20px 0; height: 48px; border-radius: 24px; background: #E9E2FB; padding: 4px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <button role="tab" aria-selected="true" style="border: 0; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; color: #231A3A; cursor: pointer">Sent</button>
    <button role="tab" aria-selected="false" style="border: 0; border-radius: 20px; background: transparent; font-family: inherit; font-size: 15px; font-weight: 700; color: #4A4163; cursor: pointer">Received</button>
  </div>

  <div style="margin: 12px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
    <button aria-label="Sent card 1" style="aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 6px; background: #FFFFFF; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer"><img src="../assets/artist-cards/ellis_tolsma_1_insects.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></button>
    <button aria-label="Sent card 2" style="aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 6px; background: #FF6EB4; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer"><img src="../assets/emoji/heart_sparkle_emoji.png" alt="" style="width: 62%; height: auto"></button>
    <button aria-label="Sent card 3" style="aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 6px; background: #E9E2FB; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer"><img src="../assets/emoji/mailbox_emoji.png" alt="" style="width: 62%; height: auto"></button>
    <button aria-label="Sent card 4" style="aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 6px; background: #FFFFFF; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer"><img src="../assets/emoji/camera_emoji.png" alt="" style="width: 66%; height: auto"></button>
    <button aria-label="Sent card 5" style="aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 6px; background: #C6FF3D; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer"><img src="../assets/emoji/pen_emoji.png" alt="" style="width: 58%; height: auto"></button>
    <button aria-label="Sent card 6" style="aspect-ratio: 1 / 1; padding: 0; border: 0; border-radius: 6px; background: #BE8EF5; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer"><img src="../assets/emoji/house_emoji.png" alt="" style="width: 60%; height: auto"></button>
  </div>

  <div style="margin: 16px 20px 0; background: #FFFFFF; border: 1.5px solid #E3DCF2; border-radius: 22px; padding: 20px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px; color: #4A4163">Left this month</span>
      <span style="font-size: 14px; color: #4A4163">Renews Nov 1</span>
    </div>
    <div style="margin-top: 6px; display: flex; align-items: baseline; gap: 10px">
      <span style="font-family: 'Unbounded', system-ui, sans-serif; font-size: 34px; line-height: 1">2</span>
      <span style="font-size: 18px; font-weight: 700">cards</span>
    </div>
    <a href="11-send-pick-a-card.html" style="margin-top: 18px; height: 56px; border-radius: 28px; background: #5A32D6; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; letter-spacing: 0.08em">SEND A CARD</a>
    <p style="margin: 12px 0 0; font-size: 14px; color: #4A4163; text-align: center">Extra cards are $2.95 each</p>
  </div>

  <div style="margin: 16px 20px 0; background: #FFFFFF; border: 1.5px solid #E3DCF2; border-radius: 22px; padding: 16px 20px">
    <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 700">Your stamp collection</span>
      <a href="#" style="font-size: 14px; font-weight: 700">See all 12</a>
    </div>
    <div style="margin-top: 12px; display: flex; gap: 12px; align-items: center">
      <img src="../assets/stamps/stamp_cherries.png" alt="Cherries stamp" style="width: 58px; height: auto; transform: rotate(-5deg); filter: drop-shadow(0 3px 5px rgba(35, 26, 58, 0.15))">
      <img src="../assets/stamps/stamp_disco_ball.png" alt="Disco ball stamp" style="width: 58px; height: auto; transform: rotate(4deg); filter: drop-shadow(0 3px 5px rgba(35, 26, 58, 0.15))">
      <img src="../assets/stamps/stamp_butterflies.png" alt="Butterflies stamp" style="width: 58px; height: auto; transform: rotate(-2deg); filter: drop-shadow(0 3px 5px rgba(35, 26, 58, 0.15))">
      <img src="../assets/stamps/stamp_rainbow.png" alt="Rainbow stamp" style="width: 58px; height: auto; transform: rotate(5deg); filter: drop-shadow(0 3px 5px rgba(35, 26, 58, 0.15))">
    </div>
  </div>

  <div style="margin: 16px 20px 0; background: #FFFFFF; border: 1.5px solid #E3DCF2; border-radius: 22px; overflow: hidden">
    <a href="18-your-address.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 18px; text-decoration: none; color: #231A3A">
      <img src="../assets/emoji/house_emoji.png" alt="" style="width: 32px; height: auto">
      <span style="flex: 1; font-size: 16px; font-weight: 700">Your address</span>
      <span style="font-size: 14px; color: #4A4163">Hidden from senders</span>
    </a>
  </div>

  <nav aria-label="Tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 104px; box-sizing: border-box; background-color: #FBF8F2; background-image: repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); background-position: 0 0px; border-top: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding-top: 14px">
    <a href="10-home.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #7A7389; font-size: 14px; font-weight: 700"><img src="../assets/emoji/house_emoji.png" alt="" style="height: 38px; width: auto; filter: grayscale(1); opacity: 0.55">Home</a>
    <a href="12-qts.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #7A7389; font-size: 14px; font-weight: 700"><img src="../assets/emoji/bff_emoji.png" alt="" style="height: 38px; width: auto; filter: grayscale(1); opacity: 0.55">QTs</a>
    <a href="11-send-pick-a-card.html" aria-label="Send a card" style="display: flex; justify-content: center; margin-top: -36px; text-decoration: none"><span style="width: 84px; height: 94px; box-sizing: border-box; padding: 6px; border-radius: 12px; background: #EEE8FB; border: 4px dashed #5A32D6; transform: rotate(-7deg); box-shadow: 0 10px 24px rgba(90, 50, 214, 0.28); display: flex"><span style="flex: 1; border-radius: 7px; background: #5A32D6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; padding-left: 0.2em"><svg aria-hidden="true" width="44" height="30" viewBox="0 0 44 30"><path d="M14 27C6 21 2 16 2 10.5 2 6 5.5 3 9.5 3c2.4 0 4 1.2 4.5 2.6C14.5 4.2 16.1 3 18.5 3 22.5 3 26 6 26 10.5 26 16 22 21 14 27z" fill="#C6FF3D"></path><path d="M23 9c3-2 5-2 8 0s5 2 8 0M23 15c3-2 5-2 8 0s5 2 8 0M23 21c3-2 5-2 8 0s5 2 8 0" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"></path></svg>SEND</span></span></a>
    <a href="13-dates.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #7A7389; font-size: 14px; font-weight: 700"><img src="../assets/emoji/calendar_emoji.png" alt="" style="height: 38px; width: auto; filter: grayscale(1); opacity: 0.55">Dates</a>
    <a href="15-profile.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: #5A32D6; font-size: 14px; font-weight: 700"><img src="../assets/emoji/sunglasses_emoji.png" alt="" style="height: 38px; width: auto">Profile</a>
  </nav>
</div>
</body>
</html>
