<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuteNote create account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&amp;family=Anonymous+Pro:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A32D6}a:hover{color:#231A3A}
</style>
<style>html{background:#E9E4F2}body{display:flex;justify-content:center;padding:24px 0}body>div{border-radius:44px;box-shadow:0 20px 60px rgba(35,26,58,.18)}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8F2; background-image: linear-gradient(to bottom, #FBF8F2 0, #FBF8F2 214px, #D9CFEC 214px, #D9CFEC 216px, transparent 216px), repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); font-family: 'Anonymous Pro', ui-monospace, Menlo, monospace; color: #231A3A; padding: 0 20px 34px; display: flex; flex-direction: column">
  <header data-qn-band="216" style="height: 216px; box-sizing: border-box; padding-top: 54px; flex: none; display: flex; flex-direction: column; justify-content: center">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="01-welcome.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #E9E2FB; display: flex; align-items: center; justify-content: center; color: #231A3A">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <img src="../assets/brand/qutenote_logo.png" alt="QuteNote" style="height: 26px; width: auto">
  </div>

  <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px">
    <h1 style="margin: 0; flex: 1; min-width: 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 26px; line-height: 1.12; letter-spacing: -0.02em">Make mail qute again.&nbsp;</h1>
    <img src="../assets/emoji/mailbox_emoji.png" alt="" style="width: 64px; height: auto; flex: none; transform: rotate(6deg)">
  </div>
  </header>

  <div style="margin-top: 26px; display: flex; justify-content: center; gap: 20px">
    <a href="03-pick-handle-google-apple.html" aria-label="Sign up with Apple" style="width: 68px; height: 68px; border: 2px solid #231A3A; border-radius: 50%; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center; padding-bottom: 3px; text-decoration: none; cursor: pointer">
      <svg aria-hidden="true" width="24" height="28" viewBox="0 0 17 20" fill="currentColor"><path d="M14.1 10.6c0-2.4 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.8-1.1-2.9-4.2zM11.6 3.2c.7-.8 1.2-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3.1 1.1.1 2.2-.6 2.9-1.4z"></path></svg>
    </a>
    <a href="03-pick-handle-google-apple.html" aria-label="Sign up with Google" style="width: 68px; height: 68px; border: 2px solid #231A3A; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"></path><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.8l7.9-6.2z"></path><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.6 42.6 14.6 48 24 48z"></path></svg>
    </a>
  </div>

  <div style="margin: 20px 0; display: flex; align-items: center; gap: 12px; font-size: 14px; color: #4A4163">
    <span style="flex: 1; height: 1.5px; background: #E3DCF2"></span>
    or use your email
    <span style="flex: 1; height: 1.5px; background: #E3DCF2"></span>
  </div>

  <div style="background: #FFFFFF; border: 1.5px solid #E3DCF2; border-radius: 18px; overflow: hidden">
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="font-size: 13px; color: #4A4163">Your name</span>
      <input autocomplete="name" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 16px; color: #231A3A; width: 100%">
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="font-size: 13px; color: #4A4163">Username</span>
      <span style="display: flex; align-items: center; font-size: 17px"><span style="color: #5A32D6; font-weight: 700">@</span><input autocomplete="username" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 16px; color: #231A3A; width: 100%"></span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="font-size: 13px; color: #4A4163">Email</span>
      <input type="email" placeholder="you@email.com" autocomplete="email" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 16px; color: #231A3A; width: 100%">
    </label>
    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
      <label style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #4A4163">Password</span>
        <input type="password" placeholder="8+ characters" autocomplete="new-password" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 16px; color: #231A3A; width: 100%">
      </label>
      <button style="min-height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: #5A32D6; cursor: pointer">SHOW</button>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <a href="04-signup-address.html" style="height: 56px; border-radius: 28px; background: #5A32D6; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; letter-spacing: 0.08em">CREATE ACCOUNT</a>
    <p style="margin: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; color: #4A4163">Already a QT? <a href="06-log-in.html" style="font-weight: 700">Log in</a></p>
  </div>
</div>
</body>
</html>
