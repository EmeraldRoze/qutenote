<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuteNote write your note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&amp;family=Anonymous+Pro:wght@400;700&amp;family=Fraunces:ital,wght@1,400&amp;family=Sora&amp;family=DM+Mono&amp;family=Rock+Salt&amp;family=Nothing+You+Could+Do&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A32D6}a:hover{color:#231A3A}
.qn-row::-webkit-scrollbar{display:none}
textarea::placeholder{color:#9A92AD}
</style>
<style>html{background:#E9E4F2}body{display:flex;justify-content:center;padding:24px 0}body>div{border-radius:44px;box-shadow:0 20px 60px rgba(35,26,58,.18)}</style>
</head>
<body>
<div style="width: 390px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8F2; background-image: linear-gradient(to bottom, #FBF8F2 0, #FBF8F2 286px, #D9CFEC 286px, #D9CFEC 288px, transparent 288px), repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); font-family: 'Anonymous Pro', ui-monospace, Menlo, monospace; color: #231A3A; padding: 0 0 34px; display: flex; flex-direction: column">
  <header data-qn-band="288" style="height: 288px; box-sizing: border-box; padding-top: 54px; flex: none; display: flex; flex-direction: column; justify-content: center">
  <div style="padding: 0 20px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 12px">
    <a href="20-send-step2-who.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #E9E2FB; display: flex; align-items: center; justify-content: center; color: #231A3A">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="font-size: 13px; color: #4A4163">Step 3 of 4</span>
      <div aria-hidden="true" style="display: flex; gap: 4px">
        <span style="width: 28px; height: 5px; border-radius: 3px; background: #FF6EB4"></span>
        <span style="width: 28px; height: 5px; border-radius: 3px; background: #FF6EB4"></span>
        <span style="width: 28px; height: 5px; border-radius: 3px; background: #FF6EB4"></span>
        <span style="width: 28px; height: 5px; border-radius: 3px; background: #F3D6E5"></span>
      </div>
    </div>
  </div>

  <div style="margin: 16px 20px 0; position: relative">
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #BE8EF5; border: 1.5px solid rgb(35, 26, 58); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">GR</span>
      <span style="display: flex; flex-direction: column">
        <span style="font-size: 13px; color: rgb(74, 65, 99)">To:&nbsp;<span style="font-size: 16px; font-weight: 700; color: rgb(35, 26, 58)">Grayson</span></span>
      </span>
    </div>
    <h1 style="margin: 14px 0 0; padding-right: 90px; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em">Say the thing.</h1>
    <p style="margin: 6px 0 0; padding-right: 90px; font-size: 15px; color: #4A4163">Put it in writing, QT</p>
    <img src="../assets/emoji/pen_emoji.png" alt="" style="position: absolute; right: 0; top: 8px; width: 92px; height: auto">
  </div>
  </header>

  <div style="margin: 22px 20px 0; position: relative">
    <div style="height: 232px; box-sizing: border-box; overflow-y: auto; border: 1.5px solid #E3DCF2; border-radius: 18px; background-color: #FFFFFF; background-image: repeating-linear-gradient(transparent, transparent 35px, #ECE6F5 35px, #ECE6F5 36px); background-attachment: local; background-position: 0 18px; padding: 18px 18px 14px 20px">
      <svg aria-hidden="true" width="52" height="62" viewBox="0 0 46 54" style="float: right; margin: 2px 0 8px 14px; transform: rotate(4deg)"><rect x="2" y="2" width="42" height="50" rx="3" fill="#EEE8FB" stroke="#5A32D6" stroke-width="2" stroke-dasharray="4 3"></rect><rect x="8" y="8" width="30" height="38" rx="2" fill="#5A32D6"></rect><path d="M23 37c-6-4-9-7.5-9-11 0-2.5 2-4.5 4.5-4.5 1.8 0 3.3 1 4.5 2.5 1.2-1.5 2.7-2.5 4.5-2.5 2.5 0 4.5 2 4.5 4.5 0 3.5-3 7-9 11z" fill="#C6FF3D"></path></svg>
      <div id="note" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Your note to Grayson" style="outline: none; min-height: 180px; font-family: 'Nothing You Could Do', cursive; font-style: normal; font-size: 19px; line-height: 36px; color: #2A1F4A; overflow-wrap: break-word">You make the hard stuff less hard and the fun stuff way more fun. Thanks for being in my corner, you magnificent little gremlin. I'm very glad you exist. xx Emerald</div>
    </div>
  </div>
  <div style="margin: 8px 20px 0; display: flex; justify-content: flex-end; align-items: center; font-size: 13px; color: #4A4163">
    <span><span id="note-count">164</span>/450</span>
  </div>

  <div style="margin: 18px 20px 0">
    
    <button aria-expanded="False" style="width: 214px; min-height: 52px; border-radius: 16px; border: 2px dashed #9ECF1B; background: #F3FFD1; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; color: #231A3A; cursor: pointer; justify-content: center">
      <img src="../assets/emoji/thought_bubble_emoji.png" alt="" style="width: 30px; height: auto">
      <span style="flex: 1; text-align: left">I NEED WORDS</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="transform: none"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>

  <div style="margin: 22px 20px 0; display: flex; align-items: baseline; justify-content: space-between">
    <h2 style="margin: 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 18px">Pick your pen</h2>
    
  </div>
  <div class="qn-row" role="radiogroup" aria-label="Pen" style="margin-top: 12px; padding: 0 20px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none">
    <button role="radio" aria-checked="true" style="flex: none; min-height: 52px; padding: 6px 18px; border-radius: 26px; border: 2px dashed #BE8EF5; background: #F3EEFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; font-family: 'Nothing You Could Do', cursive; font-size: 17px; line-height: 1.2; color: #231A3A; cursor: pointer">Your<br>handwriting</button>
    <button role="radio" aria-checked="false" style="flex: none; min-height: 52px; padding: 6px 18px; border-radius: 26px; border: 1.5px solid #E3DCF2; background: #FFFFFF; font-family: 'Fraunces', serif; font-style: italic; font-size: 19px; color: #231A3A; cursor: pointer">Fraunces</button>
    <button role="radio" aria-checked="false" style="flex: none; min-height: 52px; padding: 6px 18px; border-radius: 26px; border: 1.5px solid #E3DCF2; background: #FFFFFF; font-family: 'Sora', sans-serif; font-style: normal; font-size: 16px; color: #231A3A; cursor: pointer">Sora</button>
    <button role="radio" aria-checked="false" style="flex: none; min-height: 52px; padding: 6px 18px; border-radius: 26px; border: 1.5px solid #E3DCF2; background: #FFFFFF; font-family: 'DM Mono', monospace; font-style: normal; font-size: 15px; color: #231A3A; cursor: pointer">DM Mono</button>
    <button role="radio" aria-checked="false" style="flex: none; min-height: 52px; padding: 6px 18px; border-radius: 26px; border: 1.5px solid #E3DCF2; background: #FFFFFF; font-family: 'Rock Salt', cursive; font-style: normal; font-size: 13px; color: #231A3A; cursor: pointer">Rock Salt</button>
    <span aria-hidden="true" style="flex: none; width: 10px"></span>
  </div>

  <div style="margin-top: auto; padding: 0 20px">
    <a href="22-send-step4-preview.html" style="height: 56px; border-radius: 28px; background: #5A32D6; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700; letter-spacing: 0.08em">PREVIEW MY CARD
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</body>
</html>
