<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up: your address</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&amp;family=Anonymous+Pro:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A32D6}a:hover{color:#231A3A}
</style>
<style>html{background:#E9E4F2}body{display:flex;justify-content:center;padding:24px 0}body>div{border-radius:44px;box-shadow:0 20px 60px rgba(35,26,58,.18)}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8F2; background-image: linear-gradient(to bottom, #FBF8F2 0, #FBF8F2 214px, #D9CFEC 214px, #D9CFEC 216px, transparent 216px), repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); font-family: 'Anonymous Pro', ui-monospace, Menlo, monospace; color: #231A3A; padding: 0 24px 40px; display: flex; flex-direction: column">
  <header data-qn-band="216" style="height: 216px; box-sizing: border-box; padding-top: 54px; flex: none; display: flex; flex-direction: column; justify-content: center">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="02-create-account.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #E9E2FB; display: flex; align-items: center; justify-content: center; color: #231A3A">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    
  </div>

  <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px">
    <h1 style="margin: 0; flex: 1; min-width: 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 26px; line-height: 1.12; letter-spacing: -0.02em">Where do <br>they go?</h1>
    <img src="../assets/emoji/house_emoji.png" alt="" style="width: 64px; height: auto; flex: none; transform: rotate(-4deg)">
  </div>
  </header>

  <div style="margin-top: 18px; background: #E9E2FB; border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A32D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <p style="margin: 0; font-size: 15px; line-height: 1.45">Your address is private. It stays between us and the post office.&nbsp;</p>
  </div>

  <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 6px">
    <label for="street" style="font-size: 13px; color: #4A4163">Street address</label>
    <input id="street" value="418 Mari" style="height: 56px; box-sizing: border-box; border-radius: 14px; border: 2px solid #5A32D6; padding: 0 16px; font-family: inherit; font-size: 16px; color: #231A3A; background: #FFFFFF">
    <div style="border-radius: 14px; background: #FFFFFF; border: 1.5px solid #E3DCF2; overflow: hidden">
      <button style="width: 100%; min-height: 56px; border: 0; background: #F3EEFF; text-align: left; padding: 10px 16px; font-family: inherit; color: #231A3A; display: flex; flex-direction: column; gap: 2px; cursor: pointer">
        <span style="font-size: 15px; font-weight: 700">418 Marigold Lane</span>
        <span style="font-size: 13px; color: #4A4163">Portland, OR 97214</span>
      </button>
      <button style="width: 100%; min-height: 56px; border: 0; border-top: 1.5px solid #E3DCF2; background: #FFFFFF; text-align: left; padding: 10px 16px; font-family: inherit; color: #231A3A; display: flex; flex-direction: column; gap: 2px; cursor: pointer">
        <span style="font-size: 15px; font-weight: 700">418 Mariposa Street</span>
        <span style="font-size: 13px; color: #4A4163">Denver, CO 80204</span>
      </button>
    </div>
  </div>

  <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 6px">
    <label for="apt" style="font-size: 13px; color: #4A4163">Apt or unit (optional)</label>
    <input id="apt" placeholder="Apt 204" style="height: 56px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #CFC5E8; padding: 0 16px; font-family: inherit; font-size: 16px; color: #231A3A; background: #FFFFFF">
  </div>

  <a href="05-signup-birthday.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #5A32D6; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 15px; font-weight: 700; letter-spacing: 0.08em">VERIFY ADDRESS</a>
</div>
</body>
</html>
