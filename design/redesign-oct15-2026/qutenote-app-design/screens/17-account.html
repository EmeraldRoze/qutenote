<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuteNote account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&amp;family=Anonymous+Pro:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A32D6}a:hover{color:#231A3A}
</style>
<style>html{background:#E9E4F2}body{display:flex;justify-content:center;padding:24px 0}body>div{border-radius:44px;box-shadow:0 20px 60px rgba(35,26,58,.18)}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8F2; background-image: linear-gradient(to bottom, #FBF8F2 0, #FBF8F2 142px, #D9CFEC 142px, #D9CFEC 144px, transparent 144px), repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); font-family: 'Anonymous Pro', ui-monospace, Menlo, monospace; color: #231A3A; padding: 0 20px 34px; display: flex; flex-direction: column">
  <header data-qn-band="144" style="height: 144px; box-sizing: border-box; padding-top: 54px; flex: none; display: flex; flex-direction: column; justify-content: center">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="16-settings.html" aria-label="Back to Settings" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #E9E2FB; display: flex; align-items: center; justify-content: center; color: #231A3A">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 28px; letter-spacing: -0.02em">Account</h1>
  </div>
  </header>

  <div style="margin-top: 26px; display: flex; flex-direction: column; align-items: center">
    <div style="position: relative; width: 96px; height: 96px">
      <span style="width: 96px; height: 96px; box-sizing: border-box; border-radius: 50%; background: #F3EEFF; border: 4px solid #FBF8F2; box-shadow: 0 0 0 2px #231A3A; display: flex; align-items: center; justify-content: center; font-family: 'Unbounded', system-ui, sans-serif; font-size: 28px">ER</span>
      <button aria-label="Pick an emoji or add a photo" style="position: absolute; right: -4px; bottom: -2px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #FBF8F2; background: #5A32D6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
  </div>

  <div style="margin-top: 26px; background: #FFFFFF; border: 1.5px solid #E3DCF2; border-radius: 18px; overflow: hidden">
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="font-size: 13px; color: #4A4163">Name</span>
      <input value="Emerald Roze Cohen" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 17px; color: #231A3A; width: 100%">
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="font-size: 13px; color: #4A4163">Username</span>
      <span style="display: flex; align-items: center; font-size: 17px"><span style="color: #4A4163">@</span><input value="emeraldroze" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 17px; color: #231A3A; width: 100%"></span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="font-size: 13px; color: #4A4163">Email</span>
      <input type="email" value="emma@final.co" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 17px; color: #231A3A; width: 100%">
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px">
      <span style="font-size: 13px; color: #4A4163">Your birthday</span>
      <input type="date" value="1985-12-20" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 17px; color: #231A3A; width: 100%">
    </label>
  </div>
  <p style="margin: 10px 4px 0; font-size: 14px; line-height: 1.45; color: #4A4163">We'll send you a Qute Note when it rolls around.</p>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <p role="status" style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; color: #5A32D6">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><path d="M8 12.5l2.7 2.7L16 9.5"></path></svg>
      Saved
    </p>
    <button style="height: 56px; border: 0; border-radius: 28px; background: #5A32D6; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; cursor: pointer">SAVE CHANGES</button>
    <button style="min-height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 14px; color: #4A4163; text-decoration: underline; cursor: pointer">Delete account</button>
  </div>
</div>
</body>
</html>
