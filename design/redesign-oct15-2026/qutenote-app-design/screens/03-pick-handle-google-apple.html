<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up: pick your handle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&amp;family=Anonymous+Pro:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A32D6}a:hover{color:#231A3A}
</style>
<style>html{background:#E9E4F2}body{display:flex;justify-content:center;padding:24px 0}body>div{border-radius:44px;box-shadow:0 20px 60px rgba(35,26,58,.18)}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8F2; background-image: linear-gradient(to bottom, #FBF8F2 0, #FBF8F2 214px, #D9CFEC 214px, #D9CFEC 216px, transparent 216px), repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); font-family: 'Anonymous Pro', ui-monospace, Menlo, monospace; color: #231A3A; padding: 0 20px 34px; display: flex; flex-direction: column">
  <header data-qn-band="216" style="height: 216px; box-sizing: border-box; padding-top: 54px; flex: none; display: flex; flex-direction: column; justify-content: center">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="02-create-account.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #E9E2FB; display: flex; align-items: center; justify-content: center; color: #231A3A">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <img src="../assets/brand/qutenote_logo.png" alt="QuteNote" style="height: 26px; width: auto">
  </div>

  <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px">
    <h1 style="margin: 0; flex: 1; min-width: 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 26px; line-height: 1.12; letter-spacing: -0.02em">Pick your handle.</h1>
    <img src="../assets/emoji/bff_emoji.png" alt="" style="width: 56px; height: auto; flex: none; transform: rotate(4deg)">
  </div>
  </header>

  <p style="margin: 18px 0 0; font-size: 15px; line-height: 1.45; color: #4A4163">You're in with Google. Now choose the name your QTs will search for.</p>

  <div style="margin-top: 18px; background: #FFFFFF; border: 2px solid #5A32D6; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
    <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <span style="font-size: 13px; color: #4A4163">Username</span>
      <span style="display: flex; align-items: center; font-size: 16px"><span style="color: #5A32D6; font-weight: 700">@</span><input value="emeraldroze" autocomplete="username" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 16px; color: #231A3A; width: 100%"></span>
    </label>
    <span style="flex: none; display: inline-flex; align-items: center; gap: 6px; background: #C6FF3D; border-radius: 10px; padding: 4px 10px; font-size: 13px; font-weight: 700">
      <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      Available
    </span>
  </div>
  <p style="margin: 10px 4px 0; font-size: 13px; color: #4A4163">Letters, numbers, dots and underscores. You can change it later in Settings.</p>

  <h2 style="margin: 22px 0 10px; font-size: 13px; font-weight: 700; color: #4A4163">Or try one of these</h2>
  <div style="display: flex; flex-wrap: wrap; gap: 8px">
    <button style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #E3DCF2; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #231A3A; cursor: pointer">@emerald.r</button>
    <button style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #E3DCF2; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #231A3A; cursor: pointer">@emeraldroze_</button>
    <button style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #E3DCF2; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #231A3A; cursor: pointer">@qt.emerald</button>
  </div>

  <a href="04-signup-address.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #5A32D6; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 15px; font-weight: 700; letter-spacing: 0.08em">CONTINUE</a>
</div>
</body>
</html>
