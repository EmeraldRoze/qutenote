<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuteNote your address</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&amp;family=Anonymous+Pro:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A32D6}a:hover{color:#231A3A}
</style>
<style>html{background:#E9E4F2}body{display:flex;justify-content:center;padding:24px 0}body>div{border-radius:44px;box-shadow:0 20px 60px rgba(35,26,58,.18)}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8F2; background-image: linear-gradient(to bottom, #FBF8F2 0, #FBF8F2 142px, #D9CFEC 142px, #D9CFEC 144px, transparent 144px), repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); font-family: 'Anonymous Pro', ui-monospace, Menlo, monospace; color: #231A3A; padding: 0 20px 34px; display: flex; flex-direction: column">
  <header data-qn-band="144" style="height: 144px; box-sizing: border-box; padding-top: 54px; flex: none; display: flex; flex-direction: column; justify-content: center">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="16-settings.html" aria-label="Back to Settings" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #E9E2FB; display: flex; align-items: center; justify-content: center; color: #231A3A">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 28px; letter-spacing: -0.02em">Your address</h1>
  </div>
  </header>

  <div style="margin-top: 24px; background: #E9E2FB; border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A32D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <p style="margin: 0; font-size: 15px; line-height: 1.45">Your address is private. It stays between us and the post office.&nbsp;</p>
  </div>

  <div style="margin-top: 20px; background: #FFFFFF; border: 1.5px solid #E3DCF2; border-radius: 18px; overflow: hidden">
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="font-size: 13px; color: #4A4163">Street address</span>
      <input value="208 Camino Encantado" autocomplete="address-line1" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 17px; color: #231A3A; width: 100%">
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="font-size: 13px; color: #4A4163">Apt, suite, etc. (optional)</span>
      <input placeholder="Apt 4B" autocomplete="address-line2" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 17px; color: #231A3A; width: 100%">
    </label>
    <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="font-size: 13px; color: #4A4163">City</span>
      <input value="Santa Fe" autocomplete="address-level2" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 17px; color: #231A3A; width: 100%">
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
      <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-right: 1.5px solid #EEEAF5">
        <span style="font-size: 13px; color: #4A4163">State</span>
        <input value="NM" autocomplete="address-level1" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 17px; color: #231A3A; width: 100%">
      </label>
      <label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px">
        <span style="font-size: 13px; color: #4A4163">ZIP code</span>
        <input value="87501" inputmode="numeric" autocomplete="postal-code" style="border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 17px; color: #231A3A; width: 100%">
      </label>
    </div>
  </div>

  <p style="margin: 12px 4px 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">
    <span style="display: inline-flex; align-items: center; gap: 6px; background: #C6FF3D; border-radius: 10px; padding: 3px 10px">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      Verified
    </span>
    <span style="font-weight: 400; color: #4A4163">Ready for mail</span>
  </p>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <button style="height: 56px; border: 0; border-radius: 28px; background: #5A32D6; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; cursor: pointer">SAVE ADDRESS</button>
    <p style="margin: 0; text-align: center; font-size: 14px; color: #4A4163">US addresses only for now. More countries coming soon.</p>
  </div>
</div>
</body>
</html>
