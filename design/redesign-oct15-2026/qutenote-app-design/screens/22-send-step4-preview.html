<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send: preview your card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&amp;family=Anonymous+Pro:wght@400;700&amp;family=Nothing+You+Could+Do&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5A32D6}a:hover{color:#231A3A}
input::placeholder{color:#9A92AD}
</style>
<style>html{background:#E9E4F2}body{display:flex;justify-content:center;padding:24px 0}body>div{border-radius:44px;box-shadow:0 20px 60px rgba(35,26,58,.18)}</style>
</head>
<body>
<div style="width: 390px; height: 1008px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8F2; background-image: linear-gradient(to bottom, #FBF8F2 0, #FBF8F2 214px, #D9CFEC 214px, #D9CFEC 216px, transparent 216px), repeating-linear-gradient(transparent, transparent 35px, #E7E1EF 35px, #E7E1EF 36px); font-family: 'Anonymous Pro', ui-monospace, Menlo, monospace; color: #231A3A; padding: 0 20px 34px; display: flex; flex-direction: column">
  <header data-qn-band="216" style="height: 216px; box-sizing: border-box; padding-top: 54px; flex: none; display: flex; flex-direction: column; justify-content: center">
  <div style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 12px">
    <a href="21-send-step3-write.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #E9E2FB; display: flex; align-items: center; justify-content: center; color: #231A3A"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="font-size: 13px; color: #4A4163">Step 4 of 4</span>
      <div aria-hidden="true" style="display: flex; gap: 4px"><span style="width: 28px; height: 5px; border-radius: 3px; background: #FF6EB4"></span><span style="width: 28px; height: 5px; border-radius: 3px; background: #FF6EB4"></span><span style="width: 28px; height: 5px; border-radius: 3px; background: #FF6EB4"></span><span style="width: 28px; height: 5px; border-radius: 3px; background: #FF6EB4"></span></div>
    </div>
  </div>
  <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px">
    <h1 style="margin: 0; flex: 1; min-width: 0; font-family: 'Unbounded', system-ui, sans-serif; font-weight: 400; font-size: 26px; line-height: 1.12; letter-spacing: -0.02em">Looking good, QT.</h1>
    <img src="../assets/emoji/mailbox_emoji.png" alt="" style="width: 60px; height: auto; flex: none; transform: rotate(5deg)">
  </div>
  </header>

  <div role="tablist" aria-label="Card side" style="margin-top: 16px; align-self: center; width: 220px; height: 44px; border-radius: 22px; background: #E9E2FB; padding: 4px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <button role="tab" aria-selected="true" style="border: 0; border-radius: 20px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #231A3A; cursor: pointer">Front</button>
    <button role="tab" aria-selected="false" style="border: 0; border-radius: 20px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #231A3A; cursor: pointer">Back</button>
  </div>

  <div style="margin-top: 16px; height: 330px; display: flex; align-items: center; justify-content: center">
    
      <img src="../assets/artist-cards/ellis_tolsma_1_insects.jpg" alt="Front of the card: insects by @ellis_tolsma" style="height: 320px; width: auto; border-radius: 6px; transform: rotate(-2deg); box-shadow: 0 14px 28px rgba(35, 26, 58, 0.2)">
    
    
  </div>

  <div style="margin-top: 16px; background: #FFFFFF; border: 1.5px solid #E3DCF2; border-radius: 18px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="flex: 1; font-size: 13px; color: #4A4163">To</span>
      <span style="font-size: 15px; font-weight: 700">Grayson</span>
      <a href="20-send-step2-who.html" style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; min-height: 32px; display: flex; align-items: center">EDIT</a>
    </div>
    <div style="padding: 12px 16px; border-bottom: 1.5px solid #EEEAF5">
      <span style="font-size: 13px; color: #4A4163">When should it mail?</span>
      <div role="radiogroup" aria-label="When to mail" style="margin-top: 8px; display: flex; gap: 8px">
        <button role="radio" aria-checked="true" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 2px dashed #BE8EF5; background: #F3EEFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #231A3A; cursor: pointer">Send now</button>
        <button role="radio" aria-checked="false" style="flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #E3DCF2; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #231A3A; cursor: pointer">Schedule it</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
      <span style="flex: 1; font-size: 13px; color: #4A4163">This card</span>
      <span style="font-size: 15px; font-weight: 700">1 of your 2 this month</span>
    </div>
  </div>
  <p style="margin: 10px 4px 0; font-size: 13px; color: #4A4163">Changed your mind? You can edit it for 2 hours after you send.</p>

  <a href="10-home.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #5A32D6; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 15px; font-weight: 700; letter-spacing: 0.08em">MAIL IT</a>
</div>
</body>
</html>
